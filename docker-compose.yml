services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibe_platform}
      POSTGRES_USER: ${POSTGRES_USER:-vibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vibe}:${POSTGRES_PASSWORD:-vibe}@postgres:5432/${POSTGRES_DB:-vibe_platform}
      JWT_SECRET: ${JWT_SECRET:-local-poc-only-change-me}
      LOCAL_DEMO_AUTH: "true"
      PORTAL_ORIGIN: http://localhost:5173
      WORKSPACE_PROVIDER: ${WORKSPACE_PROVIDER:-local}
      WORKSPACE_ROOT: /var/lib/vibe/workspaces
      GOLDEN_APP_TEMPLATE_ROOT: /app/workspace-template/golden-app
      CODER_BASE_URL: ${CODER_BASE_URL:-}
      CODER_ORGANIZATION: ${CODER_ORGANIZATION:-default}
      CODER_TEMPLATE_ID: ${CODER_TEMPLATE_ID:-}
      CODER_TEMPLATE_VERSION_ID: ${CODER_TEMPLATE_VERSION_ID:-}
      CODER_OWNER: ${CODER_OWNER:-}
      CODER_TOKEN: ${CODER_TOKEN:-}
      CODER_GIT_REMOTE_URL: ${CODER_GIT_REMOTE_URL:-}
      CODE_SERVER_URL: ${CODE_SERVER_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - workspace_data:/var/lib/vibe/workspaces
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  workspace-ide:
    build:
      context: ./workspace-template
      dockerfile: Dockerfile
    environment:
      VIBE_LOCAL_COMPOSE: "true"
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - workspace_data:/workspaces
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    depends_on:
      control-plane:
        condition: service_healthy
      workspace-ide:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  workspace_data:
