name: Validate scaffold

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-scaffold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra test
      - name: Install Office rendering dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc libreoffice-writer fonts-dejavu-core
      - name: Validate structure and public safety
        run: uv run --frozen --extra test python scripts/validate_scaffold.py
      - name: Verify committed Office report packages
        run: uv run --frozen --extra test python scripts/report_generation/verify_vibe_reports.py
      - name: Rebuild and verify Office reports in an isolated output root
        run: |
          report_root="$(mktemp -d)"
          mkdir -p "$report_root/wiki/product/reports"
          export VIBE_CODE_ROOT="$report_root"
          export VIBE_REPORT_ER_DIR="$report_root/build/er"
          export VIBE_REPORT_DIAGRAM_DIR="$report_root/build/diagrams"
          uv run --frozen --extra reports python scripts/report_generation/generate_vibe_er.py
          uv run --frozen --extra reports python scripts/report_generation/generate_vibe_docs.py
          uv run --frozen --extra reports python scripts/report_generation/generate_vibe_data_spec.py
          uv run --frozen --extra reports python scripts/report_generation/recalc_xlsx.py
          uv run --frozen --extra reports python scripts/report_generation/write_vibe_report_manifest.py
          uv run --frozen --extra reports python scripts/report_generation/export_vibe_reports_to_markdown.py
          uv run --frozen --extra test python scripts/report_generation/verify_vibe_reports.py
          uv run --frozen --extra test pytest -o addopts='' -q tests/test_report_completeness.py tests/test_report_markdown_companions.py
      - name: Run tests
        run: uv run --frozen --extra test pytest
