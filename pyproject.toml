[project]
name = "agentic-development-scaffold"
version = "0.1.0"
description = "Monorepo-ready, agentic software development lifecycle scaffold"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "pillow>=10,<12"]
reports = [
  "openpyxl>=3.1,<4",
  "pillow>=10,<12",
  "python-docx>=1.1,<2",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
