[project]
name = "agentic-development-scaffold"
version = "0.1.0"
description = "Monorepo-ready, agentic software development lifecycle scaffold"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
